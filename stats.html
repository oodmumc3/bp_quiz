<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BP 퀴즈 통계</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>날짜별 통계</h1>
  <div class="stats">
    <div id="summary"></div>
    <div class="back-link"><a href="index.html">← 퀴즈로 돌아가기</a></div>
  </div>

  <div class="panel">
    <h2>날짜별 맞음/틀림</h2>
    <div id="chart"></div>
    <div class="legend">
      <span><i style="background:#6fae6f"></i>맞음</span>
      <span><i style="background:#e07a6f"></i>틀림</span>
    </div>
  </div>

  <div class="panel">
    <h2>자주 틀리는 카드 (상위 8개)</h2>
    <div id="worstList"></div>
  </div>

  <button id="resetBtn" style="background:#eee;color:#333;font-size:13px;">기록 초기화</button>
</div>

<script src="deck.js"></script>
<script src="stats.js"></script>
</body>
</html>
